# STUDIO G 배포용 Nginx 설정
# 서버 내부 IP: 172.16.1.6 / 외부(공인) IP: 211.233.208.84 (도메인 없음, IP로 접속)
#
# 설치 위치 예시:
#   Debian/Ubuntu 계열: /etc/nginx/sites-available/project  (심볼릭 링크로 sites-enabled에 연결)
#   그 외(conf.d 구조):  /etc/nginx/conf.d/project.conf

server {
    listen 80;
    # 내부 IP든 공인 IP든 어떤 주소로 들어와도 이 서버 블록이 응답하도록 catch-all로 설정
    server_name _;

    # Vue 빌드 결과물(dist) 경로
    root /var/www/project_frontend/dist;
    index index.html;

    # Vue Router(History 모드) 새로고침 대응
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 로 오는 요청은 백엔드(127.0.0.1:8080)로 프록시
    # 프론트와 API가 항상 같은 origin(접속한 주소 그대로)을 쓰게 되어 CORS 설정이 별도로 필요 없습니다.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;
}
