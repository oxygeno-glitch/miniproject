spring:
  application:
    name: mini

  # 운영 서버 DB 접속 정보 - 실제 값은 서버의 .env(EnvironmentFile)로 주입합니다.
  # 소스코드에는 절대 실제 비밀번호를 적지 마세요.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      # 처음 배포할 때는 update로 테이블을 자동 생성하고,
      # 운영이 안정되면 DDL_AUTO=validate 로 바꿔서 스키마 실수 변경을 막는 걸 권장합니다.
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  # Nginx가 앞단에서 80번 포트로 요청을 받아 /api를 이 포트로 프록시합니다.
  # 127.0.0.1로만 열어서 8080 포트가 외부에 직접 노출되지 않도록 합니다.
  address: 127.0.0.1
